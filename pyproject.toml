[project]
name = "shareconn"
version = "0.1.0"
description = "Share Helper - 智能分享内容解析与管理助手"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # Redis & Celery
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # LLM & Agent
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    # 向量数据库
    "qdrant-client>=1.9.0",
    # HTTP & 解析
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # 配置 & 工具
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 定时任务
    "apscheduler>=3.10.0",
    # WebSocket
    "websockets>=12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
browser = [
    "playwright>=1.44.0",
]
